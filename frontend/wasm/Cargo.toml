[package]
name = "confidant-wasm"
version = "0.0.1"
description = "Confidant wallet for the browser: confidant-core's Wallet behind wasm-bindgen — keys, notes, proving and signing never leave the page"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
confidant-core = { path = "../../core", default-features = false }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde.workspace = true
serde_json.workspace = true
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
# `threads`: proving on a Web-Worker thread pool (wasm-bindgen-rayon over orchard/halo2's rayon
# parallelism). Needs nightly + `-Z build-std=panic_abort,std` with atomics and a page that is
# cross-origin isolated (COOP/COEP); the default build stays single-threaded and runs anywhere.
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"], optional = true }

[features]
default = []
threads = ["dep:wasm-bindgen-rayon", "confidant-core/multicore"]

[package.metadata.wasm-pack.profile.release]
# wasm-opt must be told about the shared-memory features the threaded build uses.
wasm-opt = ["-O", "--enable-threads", "--enable-bulk-memory", "--enable-mutable-globals"]
