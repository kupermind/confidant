name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Proving tests are release-profile heavy; `--release` keeps CI under control.
      - run: cargo test --workspace --release

  coverage:
    name: coverage (100% of core lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          key: llvm-cov
      # Every line of the core is exercised by its tests; a drop below 100% fails the build.
      # Regions/functions are reported for information (unreachable `?` error branches on
      # library calls that cannot fail under the pool's invariants stay as missed regions).
      - run: cargo llvm-cov -p confidant-core --all-targets --fail-under-lines 100
      # The node is tested against a fake ledger; `main.rs` and the real JSON-RPC client (`rpc.rs`)
      # need a process and a network and are exercised by the testnet harness instead.
      - run: cargo llvm-cov -p confidant-node --all-targets --ignore-filename-regex '(main|rpc)\.rs' --fail-under-lines 95
      # The demo wallet service (UI prototype): store + HTTP tested against an in-process verifier.
      - run: cargo llvm-cov -p confidant-wallet --all-targets --ignore-filename-regex '(main|rpc)\.rs' --fail-under-lines 90

  quorum:
    # The signer sidecar's "no blind signing" guard (tx shape vs. its own node's endorsement) is pure
    # and unit-tested without a ledger; the services themselves run in the manual testnet job.
    name: quorum (sidecar shape tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend/quorum
      - run: npm test
        working-directory: backend/quorum

  hygiene:
    name: hygiene (no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No key-shaped files in the tree
        run: |
          if git ls-files | grep -E '\.(pem|key|seed)$|(^|/)\.env($|\.)|keystore.*\.json$|pool-state.*\.json$'; then
            echo "::error::key-shaped or state file committed — see CLAUDE.md"; exit 1
          fi
      - name: Honest labels present (audit conditions C1–C4)
        run: |
          for f in SPEC.md README.md; do
            for marker in "custodial" "Endpoint correlation" "full viewing key" "pre-populate"; do
              grep -qi -- "$marker" "$f" || { echo "::error file=$f::missing honest-label marker '$marker' (docs/audit/RESP-pool-design-2026-10-04.md C1–C4)"; exit 1; }
            done
          done
      - name: No over-claims outside the "do not say" rule (audit Q-IMPL-2)
        # Allow-list: a hit is fine only when its own line or the line before it is the rule
        # that forbids the claim, or names it as roadmap. Anything else is an over-claim.
        run: |
          awk 'tolower($0) ~ /untraceable|trustless|fully anonymous|private from the operator/ {
                 if ((prev " " $0) !~ /(Do not|Don.t say|Never claim|roadmap)/) {
                   printf "::error file=%s,line=%d::over-claim outside the do-not-say rule: %s\n", FILENAME, FNR, $0; bad = 1
                 }
               }
               { prev = $0 }
               END { exit bad }' SPEC.md README.md
      - name: Russian spec carries the same labels and no over-claims
        run: |
          for marker in "кастодиальн" "корреляци" "full viewing key" "предзаполн"; do
            grep -qi -- "$marker" SPEC.ru.md || { echo "::error file=SPEC.ru.md::missing honest-label marker '$marker'"; exit 1; }
          done
          awk 'tolower($0) ~ /untraceable|trustless|fully anonymous|неотслеживаем|полностью анонимн|приватно от оператора/ {
                 if ((prev " " $0) !~ /(Не говорить|не говорить|Нельзя заявлять|дорожная карта|roadmap|дефект)/) {
                   printf "::error file=%s,line=%d::over-claim outside the do-not-say rule: %s\n", FILENAME, FNR, $0; bad = 1
                 }
               }
               { prev = $0 }
               END { exit bad }' SPEC.ru.md

  e2e-testnet:
    # Manual only: real XRPL testnet Payments via the faucet. Run from the Actions tab.
    name: e2e on XRPL testnet (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --example cli --bin confidant-node --bin confidant-wallet
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: e2e/testnet
      - run: npm ci
        working-directory: backend/quorum
      - run: CLI=../../target/release/examples/cli npm run e2e
        working-directory: e2e/testnet
      - run: CLI=../../target/release/examples/cli NODE_BIN=../../target/release/confidant-node npm run e2e:services
        working-directory: e2e/testnet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-testnet-report
          path: |
            data/e2e-*.report.json
            data/e2e-*.log.json
            data/e2e-services-*/report.json
