[workspace]
resolver = "2"
members = ["core", "backend/node"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# The reused Halo 2 circuit: Zcash Orchard, unchanged. See docs/audit/REQ-pool-design-2026-10-04.md.
orchard = { version = "0.15.5", default-features = false, features = ["circuit", "multicore", "std"] }
incrementalmerkletree = "0.8"
shardtree = "0.7"
zcash_note_encryption = "0.4"
blake2b_simd = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
subtle = "2"
nonempty = { version = "0.11", default-features = false }

[profile.dev]
# Halo 2 proving in an unoptimised build takes minutes per bundle; keep deps optimised
# even in dev so `cargo test` stays usable.
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false
