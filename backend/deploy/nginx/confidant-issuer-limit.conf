# The demo issuer's request limit (http context): install as /etc/nginx/conf.d/confidant-issuer-limit.conf
# BEFORE rendering confidant-ui-tls.conf / confidant-ui.conf — their `location /issuer/` uses zone=issuer,
# and `nginx -t` fails without it. 60 requests a minute per client address; the site allows a burst of 20 and
# answers the excess with 429 (docs/NODE-OPERATOR.md, demo issuer service).
limit_req_zone $binary_remote_addr zone=issuer:1m rate=60r/m;
