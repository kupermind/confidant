# The UI over HTTPS on a domain: the same static page and same-origin proxies as confidant-ui.conf,
# plus TLS. HTTPS makes the page a secure context, so browsers honour COOP/COEP and the wallet gets
# its thread pool (over plain http://<ip>/ they ignore the headers and it runs on one thread).
#
# __DOMAIN__ is a placeholder: render with
#   sed 's/__DOMAIN__/<domain>/g' confidant-ui-tls.conf > /etc/nginx/sites-available/confidant-ui
# The certificate must exist first (certbot certonly, see backend/deploy/README.md), or `nginx -t` fails.
# The issuer's rate-limit zone must be installed first: confidant-issuer-limit.conf into /etc/nginx/conf.d/.

# Port 80: ACME renewals and a redirect to HTTPS, nothing else.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__ www.__DOMAIN__ _;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

# www → apex, so the page has exactly one origin.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /srv/confidant/repo/frontend;
    index index.html;

    access_log /var/log/nginx/confidant-ui.access.log;
    error_log  /var/log/nginx/confidant-ui.error.log;
    client_max_body_size 4m;

    # The TRUST platform pages at clean URLs (/trust, /trust-technical); the files are
    # frontend/trust.html and frontend/trust-technical.html, served by "location /" below.
    location = /trust { rewrite ^ /trust.html last; }
    location = /trust-technical { rewrite ^ /trust-technical.html last; }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        # Cross-origin isolation for the multithreaded WebAssembly wallet (frontend/pkg-threads).
        # Every cross-origin resource the page loads must carry CORP (the xrpl.js CDN does).
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
    }
    location = /site.webmanifest { default_type application/manifest+json; }
    # demo issuer service (backend/quorum/issuer.mjs): writes the entry credential to any account that asks, rate-limited
    location /issuer/ {
        limit_req zone=issuer burst=20 nodelay;
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:7960/;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    # coordinator (holds nothing): submits wait for the anchor, allow long reads
    location /api/ {
        proxy_pass         http://127.0.0.1:7900/;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    # demo wallet service (proving takes seconds)
    location /wallet/ {
        proxy_pass         http://127.0.0.1:7950/;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    # verifier nodes, read side only: a lender's proof-of-funds check is asked of each node itself,
    # never of the coordinator (docs/PROOF-OF-FUNDS.md §2); the node caps the body and the concurrency.
    location ~ ^/node/(?<i>[0-9])/(?<rest>pof/verify|state)$ {
        proxy_pass         http://127.0.0.1:770$i/$rest;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}
