# nginx in front of the coordinator: the only port the firewall opens for Confidant.
# A browser UI on another origin needs CORS; submits block until the anchor validated (allow ~2 min).
server {
    listen 8787;
    listen [::]:8787;
    server_name _;

    access_log /var/log/nginx/confidant.access.log;
    error_log  /var/log/nginx/confidant.error.log;

    client_max_body_size 4m;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;

        proxy_pass         http://127.0.0.1:7900;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
