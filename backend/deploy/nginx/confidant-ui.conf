# The UI prototype: static page + same-origin proxies to the coordinator (/api/) and the demo wallet
# service (/wallet/). Plain HTTP on port 80 for a host reached by IP; with a domain use
# confidant-ui-tls.conf instead (HTTPS is what gives the browser wallet its threads).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/confidant/repo/frontend;
    index index.html;

    access_log /var/log/nginx/confidant-ui.access.log;
    error_log  /var/log/nginx/confidant-ui.error.log;
    client_max_body_size 4m;

    # The TRUST platform pages at clean URLs (/trust, /trust-technical); the files are
    # frontend/trust.html and frontend/trust-technical.html, served by "location /" below.
    location = /trust { rewrite ^ /trust.html last; }
    location = /trust-technical { rewrite ^ /trust-technical.html last; }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        # Cross-origin isolation: lets the page use SharedArrayBuffer, which the multithreaded
        # WebAssembly wallet (frontend/pkg-threads) needs. Every cross-origin resource the page
        # loads must then carry CORP (the xrpl.js CDN does) or be same-origin.
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
    }
    # coordinator (holds nothing): submits wait for the anchor, allow long reads
    location /api/ {
        proxy_pass         http://127.0.0.1:7900/;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    # demo wallet service (proving takes seconds)
    location /wallet/ {
        proxy_pass         http://127.0.0.1:7950/;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    # verifier nodes, read side only: a lender's proof-of-funds check is asked of each node itself,
    # never of the coordinator (docs/PROOF-OF-FUNDS.md §2); the node caps the body and the concurrency.
    location ~ ^/node/(?<i>[0-9])/(?<rest>pof/verify|state)$ {
        proxy_pass         http://127.0.0.1:770$i/$rest;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}
